# Builds the AppImage and the Flatpak bundle on every push; a pushed tag
# vX.Y.Z (matching markdown_editor.VERSION) publishes them as a
# GitHub release.
name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: python3 -m unittest discover tests -v
      - name: Preview rendering tests
        run: |
          cd web-src
          npm ci --legacy-peer-deps --ignore-scripts
          node test-chunks.mjs
      - name: Bundled preview is built from the sources
        run: |
          cd web-src
          node build.mjs
          # Every vendored file, including new or deleted ones.
          git add --intent-to-add ../markdown_editor/web/vendor
          git diff --exit-code --stat HEAD -- ../markdown_editor/web/vendor
      - name: Tag matches the application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'from markdown_editor import VERSION; print(VERSION)')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

  appimage:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  flatpak:
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Bundle name
        id: name
        run: echo "bundle=markdown-editor-$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' markdown_editor/__init__.py)-x86_64.flatpak" >> "$GITHUB_OUTPUT"
      - name: Flathub lint (manifest and AppStream metadata)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          # The linter's sandbox cannot write to the checkout: lint a copy.
          work="$HOME/flathub-lint"
          rm -rf "$work" && mkdir -p "$work" && cp -r packaging data "$work"/
          cd "$work"
          lint() { flatpak run --filesystem="$work" --command=flatpak-builder-lint org.flatpak.Builder "$@"; }
          lint manifest packaging/flatpak/io.github._24icewolf42.markdown-editor.yml
          lint appstream data/io.github._24icewolf42.markdown-editor.metainfo.xml
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: ${{ steps.name.outputs.bundle }}
          manifest-path: packaging/flatpak/io.github._24icewolf42.markdown-editor.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the AppStream metadata
        run: |
          python3 - "$GITHUB_REF_NAME" > notes.md <<'PY'
          import sys, xml.etree.ElementTree as ET
          version = sys.argv[1].lstrip("v")
          root = ET.parse("data/io.github._24icewolf42.markdown-editor.metainfo.xml").getroot()
          rel = next((r for r in root.iter("release") if r.get("version") == version), None)
          if rel is None:
              sys.exit(f"metainfo has no <release version=\"{version}\">")
          text = lambda el: " ".join("".join(el.itertext()).split())
          for el in rel.iter():
              if el.tag == "p":
                  print(text(el))
              elif el.tag == "li":
                  print(f"- {text(el)}")
          print()
          print("**Downloads**")
          print("- `.flatpak` (recommended): self-contained. `flatpak install --user <file>`; pulls the GNOME 51 runtime from Flathub.")
          print("- `.AppImage`: small; uses the system's GNOME libraries and needs a GNOME 49 or newer desktop "
                "(GTK 4.12+, libadwaita 1.8+, GtkSourceView 5, WebKitGTK 6.0, PyGObject). `chmod +x` it after downloading.")
          PY
          cat notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Markdown Editor ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
